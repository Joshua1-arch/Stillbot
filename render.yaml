services:
  - type: web
    name: stillbot
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install chromium"
    startCommand: "python telegram_bot.py"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DRY_RUN
        value: "False"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
